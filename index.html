<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CC HS26 </title>
  <meta name="title" content="BA Interaction Design : Creative Coding Portfolio" />
  <link rel="icon" type="image/x-icon" href="favicon/favicon.ico" />
  <style>
    @font-face {
      font-family: "Suisse";
      src: url("fonts/Suisse.ttf") format("truetype");
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: "Suisse", -apple-system, system-ui, sans-serif;
    }

    .split {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    .half {
      flex: 1;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      text-decoration: none;
    }

    /* the zoomable background lives in its own layer */
    .half::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: inherit;
      background-size: cover;
      background-position: center;
      transition: transform 0.6s ease;
      z-index: 1;
    }

    .half:hover::before {
      transform: scale(1.03);
    }

    .label {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      z-index: 2;
      color: #fff;
      mix-blend-mode: difference;
      font-size: clamp(1.5rem, 4vw, 5rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      text-decoration: none;
      white-space: nowrap;
      pointer-events: none;
      transition: transform 0.4s ease;
    }

    .half:hover .label {
      transform: translate(-50%, -50%) scale(1.05);
    }

    @media (max-width: 600px) {
      .split { flex-direction: column; }
      .label { font-size: clamp(2.25rem, 10vw, 5rem); }
    }
  </style>
</head>

<body>
  <div class="split">
    <a class="half" href="./projects/project1/index.html"
       style="background-image: url('./projects/project1/thumbnail.gif')">
      <span class="label">PROJECT 1</span>
    </a>
    <a class="half" href="./projects/project2/index.html"
       style="background-image: url('./projects/project2/thumbnail.gif')">
      <span class="label">PROJECT 2</span>
    </a>
  </div>
</body>

</html>
